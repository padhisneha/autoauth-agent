[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoauth-backend"
version = "1.0.0"
description = "AutoAuth Agent - Autonomous Prior Authorization Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "AutoAuth Team"}
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "openai>=1.30.0",
    "sse-starlette>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]